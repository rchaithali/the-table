services:
  - type: web
    name: the-table
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_TRANSLATE_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_WHISPER_MODEL
        value: whisper-large-v3
